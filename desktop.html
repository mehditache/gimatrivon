<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>גימטריבון</title>
<script>try{if(localStorage.getItem('gimatrivonTheme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<link rel="stylesheet" href="styles.css?v=4.6.37">
<link rel="stylesheet" href="desktop.css?v=4.6.37">
</head>
<!-- שולחן העבודה (v4.0.0): בנר קבוע, חלונות (גימטריה אחד, עד 5 חלונות קריאה) ושורת משימות. כל חלון הוא
     index.html?embed=… בתוך iframe — מסכי הגימטריה והקריאה עצמם לא משתנים. הלוגיקה ב-desktop.js. -->
<body data-mode="read">
<header class="top dkTop" id="dkBan">
  <div class="brand"><h1 class="dkLogo" aria-label="תורה אחת — torah.one"><b>תורה אחת</b><i></i><em>TORAH.ONE</em></h1><span class="ver" id="dkVer"></span></div>
  <div class="reader rdTop dkRd">
    <div class="dkWg" id="dkWg" hidden></div>
    <div class="dkOmniSlot">
    <div class="rdOmni dkOmni">
      <div class="rdSearch dkSearch" id="dkSearch">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="dkQ" dir="rtl" autocomplete="off" spellcheck="false" placeholder='חיפוש, או קפיצה: "שמות יב ב"'>
        <kbd>Ctrl Shift K</kbd>
        <button type="button" class="dkScope" id="dkScope" title="טווח החיפוש">בספר</button>
      </div>
    </div>
    </div>
    <div class="dkScMenu" id="dkScMenu" hidden></div>
    <div class="rdNav dkNav" id="dkNav"></div>
    <div class="rdTools dkTools" id="dkTools"></div>
    <div class="dkGemTools" id="dkGemTools" hidden>
      <button type="button" class="tourBtn" data-fwd="#startTour" title="הפעלת סיור מודרך קצר באפליקציה">? סיור מודרך</button>
    </div>
  </div>
  <div class="tools">
    <label class="themeSw" title="מעבר בין מראה גוויל למראה לילה">
      <input type="checkbox" id="dkTheme" aria-label="מראה כהה (לילה בגוויל)">
      <span class="trk"><span class="thb"></span></span>
    </label>
    <button id="dkLang" class="langSw" type="button" title="Switch to English / החלף לעברית">EN</button>
  </div>
  <button id="dkKebab" class="mKebabBtn" type="button" title="תפריט" aria-label="תפריט"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button>
</header>
<div class="dkMid">
<!-- שורת המשימות: סרגל אנכי צר בצד ימין, מלמעלה למטה -->
<footer class="dkTask" id="dkTask"></footer>
<main class="dkDesk" id="dkDesk"></main>
</div>
<div class="dkMenu" id="dkArr" hidden>
  <button type="button" data-arr="stage"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="5" width="13" height="14" rx="2"/><path d="M4 8v8"/></svg>במה (חלון אחד במרכז)</button>
  <button type="button" data-arr="cascade"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="12" height="11" rx="2"/><path d="M8 8V5h12v11h-4"/></svg>מדורג</button>
  <button type="button" data-arr="side"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="7" height="14" rx="1.5"/><rect x="13" y="5" width="7" height="14" rx="1.5"/></svg>זה לצד זה</button>
  <button type="button" data-arr="grid"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>רשת</button>
  <button type="button" data-arr="minall"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2.5"/><path d="M8 15h8"/></svg>מזער הכול</button>
  <button type="button" data-arr="clean" class="dg"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"/></svg>שולחן נקי</button>
  <button type="button" data-sl><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>שינה אוטומטית</button>
</div>
<div class="dkToast" id="dkToast" hidden></div>
<script src="sqlite-search.js"></script>
<script src="sqpool.js"></script>
<script src="desktop.js?v=4.6.37"></script>
</body>
</html>
