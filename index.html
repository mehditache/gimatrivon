<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>גימטריבון</title>
<script>try{if(localStorage.getItem('gimatrivonTheme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<link rel="stylesheet" href="vendor/driver.css">
<link rel="stylesheet" href="styles.css">
</head>
<body data-view="A">
<header class="top">
  <div class="brand"><h1>גימטריבון</h1><span class="ver" id="ver" title="מספר גרסה"></span><span class="tagline">תנ״ך · משנה · רש״י · תרגומים</span></div>
  <div class="seg sideSw" id="sideSw" role="group" aria-label="בחירת צד"><button data-v="A" class="on">צד א׳</button><button data-v="B">צד ב׳</button></div>
  <div class="tools">
    <label class="themeSw" title="מעבר בין מראה גוויל למראה לילה">
      <input type="checkbox" id="themeChk" aria-label="מראה כהה (לילה בגוויל)">
      <span class="trk"><span class="thb"></span></span>
    </label>
    <button id="langSw" class="langSw" type="button" title="Switch to English / החלף לעברית">EN</button>
    <button id="startTour" class="tourBtn" title="הפעלת סיור מודרך קצר באפליקציה">? סיור מודרך</button>
    <button id="openMethods">שיטות גימטריה</button>
    <button id="openAbout" title="מידע על האפליקציה">ℹ אודות</button>
    <button id="openContact" title="יצירת קשר עם המפתח">✉ צור קשר</button>
    <span id="status" class="status" role="status">טוען קורפוס…</span>
  </div>
</header>
<main class="ws" id="ws" aria-label="סביבת עבודה"></main>
<dialog id="dlgMethods" class="dlg"><div class="dh"><h2>שיטות הגימטריה</h2><button class="x" data-close aria-label="סגור">✕</button></div><div class="sc doc" id="methodsDoc"></div></dialog>
<dialog id="dlgAbout" class="dlg about"><div class="dh"><h2>אודות גימטריבון</h2><button class="x" data-close aria-label="סגור">✕</button></div><div class="sc doc" id="aboutDoc"></div></dialog>
<dialog id="dlgContact" class="dlg about contactDlg">
  <div class="dh"><h2>צור קשר</h2><button class="x" data-close aria-label="סגור">✕</button></div>
  <div class="sc doc contactBody">
    <form id="contactForm">
      <label for="cName">שם</label>
      <input type="text" id="cName" name="from_name" autocomplete="name" required>
      <label for="cEmail">אימייל</label>
      <input type="email" id="cEmail" name="reply_to" autocomplete="email" required>
      <label for="cMsg">הודעה</label>
      <textarea id="cMsg" name="message" required></textarea>
      <div class="contactActions">
        <span id="contactStatus" class="status" role="status"></span>
        <button type="submit" id="contactSend">שליחה</button>
      </div>
    </form>
  </div>
</dialog>
<!-- הקורפוס מפוצל ל-10 חלקים קטנים יותר (ולא קובץ JS ענק אחד) כי GitHub Pages
     נתגלה כקוטע (ללא שגיאת HTTP!) קבצים סטטיים גדולים מדי. ראו scripts/split-corpus.js. -->
<script src="generated/corpus.part0.js"></script>
<script src="generated/corpus.part1.js"></script>
<script src="generated/corpus.part2.js"></script>
<script src="generated/corpus.part3.js"></script>
<script src="generated/corpus.part4.js"></script>
<script src="generated/corpus.part5.js"></script>
<script src="generated/corpus.part6.js"></script>
<script src="generated/corpus.part7.js"></script>
<script src="generated/corpus.part8.js"></script>
<script src="generated/corpus.part9.js"></script>
<script src="generated/corpus.loader.js"></script>
<script src="engine.js"></script>
<script src="vendor/driver.js"></script>
<script src="app.js"></script>
</body>
</html>
